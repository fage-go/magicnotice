name: Android Unsigned Release Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release-apks:
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check whether the Android source is present
        id: source
        shell: bash
        run: |
          if [[ ! -f settings.gradle && ! -f gradlew && ! -d app ]]; then
            echo "::notice::Android source has not been published yet; no APKs were built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ -f settings.gradle && -f gradlew && -f app/build.gradle ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android source is incomplete; expected settings.gradle, gradlew, and app/build.gradle."
            exit 1
          fi

      - name: Install Android SDK packages
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-30" "build-tools;30.0.2" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Assemble Chinese and English unsigned release APKs
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          unset MAGICNOTICE_KEYSTORE MAGICNOTICE_STORE_PASSWORD MAGICNOTICE_KEY_ALIAS MAGICNOTICE_KEY_PASSWORD
          unset MAGICNOTICE_LEGACY_EXPORT_KEY MAGICNOTICE_LEGACY_EXPORT_IV
          bash ./gradlew --no-daemon :app:assembleZhRelease :app:assembleEnRelease

      - name: Validate and stage the unsigned APKs
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          for locale in ("zh", "en"):
              matches = sorted(Path("app/build/outputs").rglob(f"cicada_{locale}_release_v*.apk"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {locale} release APK; found {len(matches)}")
              apk = matches[0]
              with ZipFile(apk) as archive, apk.open("rb") as raw:
                  names = set(archive.namelist())
                  if archive.testzip() is not None or not {"AndroidManifest.xml", "classes.dex"} <= names:
                      raise SystemExit(f"Invalid APK: {apk.name}")
                  if any(re.fullmatch(r"META-INF/(?:[^/]+\.(?:SF|RSA|DSA|EC)|SIG-[^/]+)", n, re.I) for n in names):
                      raise SystemExit(f"Unexpected v1 signature in {apk.name}")
                  if archive.start_dir < 16:
                      raise SystemExit(f"Invalid ZIP directory in {apk.name}")
                  raw.seek(archive.start_dir - 16)
                  if raw.read(16) == b"APK Sig Block 42":
                      raise SystemExit(f"Unexpected APK signing block in {apk.name}")
              output = Path("ci-apks") / locale
              output.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(apk, output / apk.name.replace(".apk", "-unsigned.apk"))
              print(f"Verified unsigned: {apk.name}")
          PY

      - name: Upload Chinese unsigned release APK
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-zh-release-unsigned
          path: ci-apks/zh/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload English unsigned release APK
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-en-release-unsigned
          path: ci-apks/en/*.apk
          if-no-files-found: error
          retention-days: 14

  sign-release-apks:
    needs: unsigned-release-apks
    if: >-
      needs.unsigned-release-apks.result == 'success' &&
      needs.unsigned-release-apks.outputs.ready == 'true' &&
      github.repository == 'fage-go/magicnotice' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: android-release
    outputs:
      published_artifacts_ready: ${{ steps.sign.outputs.ready }}
    steps:
      - name: Check signing configuration
        id: config
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set +x
          configured=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -n "${!key-}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" == 0 ]]; then
            echo "::notice::Unsigned build artifacts are available. Configure the android-release environment to publish signed APKs."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$configured" != 5 ]]; then
            echo "::error::Incomplete android-release signing configuration. Set all four signing secrets and the expected certificate fingerprint."
            exit 1
          fi
          expected=$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The expected signing certificate SHA-256 fingerprint is invalid."
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Install Android signing tools
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;30.0.3"

      - name: Download validated Chinese unsigned APK
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MagicNotice-zh-release-unsigned
          path: unsigned-apks/zh

      - name: Download validated English unsigned APK
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MagicNotice-en-release-unsigned
          path: unsigned-apks/en

      - name: Sign and verify both APKs
        if: steps.config.outputs.ready == 'true'
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          shopt -s nullglob dotglob
          expected=$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/magicnotice-sign.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$work/release.keystore" 2>"$work/signer.log" || [[ ! -s "$work/release.keystore" ]]; then
            echo "::error::The configured Android keystore could not be decoded."
            exit 1
          fi
          unset ANDROID_KEYSTORE_BASE64

          tools="$ANDROID_HOME/build-tools/30.0.3"
          for locale in zh en; do
            files=("unsigned-apks/$locale/"*)
            [[ ${#files[@]} == 1 && -f "${files[0]}" && ! -L "${files[0]}" && -s "${files[0]}" ]]
            name="${files[0]##*/}"
            [[ "$name" =~ ^cicada_${locale}_release_v[0-9]+-unsigned\.apk$ ]]
            output="${name%-unsigned.apk}-signed.apk"
            "$tools/zipalign" -p -f 4 "${files[0]}" "$work/$locale-aligned.apk"
            if ! "$tools/apksigner" sign --ks "$work/release.keystore" \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
                --v4-signing-enabled false --out "$work/$output" "$work/$locale-aligned.apk" >"$work/signer.log" 2>&1; then
              echo "::error::Android signing failed. Verify the keystore, alias and passwords in android-release."
              exit 1
            fi
            "$tools/zipalign" -c -p 4 "$work/$output"
            if ! "$tools/apksigner" verify --verbose --print-certs "$work/$output" >"$work/verify.log" 2>&1; then
              echo "::error::APK signing verification failed."
              exit 1
            fi
            signers=$(awk -F ': ' '/^Number of signers: / {print $2}' "$work/verify.log")
            cert=$(awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest: / {print tolower($2)}' "$work/verify.log")
            if [[ "$signers" != 1 || "$cert" != "$expected" ]]; then
              echo "::error::APK does not have exactly one signer with the expected official certificate."
              exit 1
            fi
          done
          for locale in zh en; do
            mkdir -p "signed-apks/$locale"
            cp -- "$work/"cicada_"$locale"_release_v*-signed.apk "signed-apks/$locale/"
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload verified Chinese signed APK
        if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-zh-release-signed
          path: signed-apks/zh/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified English signed APK
        if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-en-release-signed
          path: signed-apks/en/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-signed-release:
    needs: sign-release-apks
    if: >-
      needs.sign-release-apks.result == 'success' &&
      needs.sign-release-apks.outputs.published_artifacts_ready == 'true' &&
      github.repository == 'fage-go/magicnotice' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: magicnotice-signed-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download verified signed Chinese APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MagicNotice-zh-release-signed
          path: release-apks/zh

      - name: Download verified signed English APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MagicNotice-en-release-signed
          path: release-apks/en

      - name: Publish the two APKs as a pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          paths=()
          names=()
          for locale in zh en; do
            files=("release-apks/$locale/"*)
            [[ ${#files[@]} == 1 && -f "${files[0]}" && ! -L "${files[0]}" && -s "${files[0]}" ]]
            name="${files[0]##*/}"
            [[ "$name" =~ ^cicada_${locale}_release_v[0-9]+-signed\.apk$ ]]
            paths+=("${files[0]}")
            names+=("$name")
          done

          repo=fage-go/magicnotice
          tag="signed-${GITHUB_SHA:0:12}"
          notes='包含中文和英文版 Release APK，均已使用官方签名并核验签名证书。 Both APKs were signed and verified against the official certificate.'

          target=$(gh api "repos/$repo/git/matching-refs/tags/$tag" | jq -c --arg ref "refs/tags/$tag" '[.[] | select(.ref == $ref)]')
          jq -e --arg sha "$GITHUB_SHA" 'length == 0 or (length == 1 and .[0].object.type == "commit" and .[0].object.sha == $sha)' <<<"$target" >/dev/null

          release=$(gh api --paginate --slurp "repos/$repo/releases?per_page=100" | jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("Duplicate release tag") else .[0] end')
          if [[ "$release" == null ]]; then
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" \
              --title "MagicNotice $tag" --notes "$notes" --draft --prerelease --latest=false
            release=$(gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease,targetCommitish,assets \
              --jq '{draft: .isDraft, prerelease: .isPrerelease, target_commitish: .targetCommitish, assets: .assets}')
          fi

          jq -e --arg sha "$GITHUB_SHA" --arg zh "${names[0]}" --arg en "${names[1]}" '
            .prerelease and .target_commitish == $sha and
            all(.assets[]; (.name == $zh or .name == $en) and .state == "uploaded" and .size > 0)
          ' <<<"$release" >/dev/null

          missing=()
          for i in 0 1; do
            if ! jq -e --arg name "${names[i]}" 'any(.assets[]; .name == $name)' <<<"$release" >/dev/null; then
              missing+=("${paths[i]}")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$tag" "${missing[@]}" --repo "$repo"
          fi

          gh release view "$tag" --repo "$repo" --json assets | jq -e --arg zh "${names[0]}" --arg en "${names[1]}" '
            (.assets | map(.name) | sort) == ([$zh, $en] | sort) and all(.assets[]; .state == "uploaded" and .size > 0)
          ' >/dev/null
          if [[ "$(jq -r '.draft' <<<"$release")" == true ]]; then
            gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
          fi
          gh api "repos/$repo/git/ref/tags/$tag" | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease,url --jq 'if .isPrerelease and (.isDraft | not) then .url else error("Release is not a published pre-release") end'
