name: Android Debug Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check whether the Android source is present
        id: source
        shell: bash
        run: |
          if [[ ! -f settings.gradle && ! -f gradlew && ! -d app ]]; then
            echo "::notice::Android source has not been published yet; no APKs were built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ -f settings.gradle && -f gradlew && -f app/build.gradle ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android source is incomplete; expected settings.gradle, gradlew, and app/build.gradle."
            exit 1
          fi

      - name: Install Android SDK packages
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-30" "build-tools;30.0.2" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Assemble Chinese and English debug APKs
        if: steps.source.outputs.ready == 'true'
        run: bash ./gradlew --no-daemon :app:assembleZhDebug :app:assembleEnDebug

      - name: Upload Chinese debug APK
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-zh-debug
          path: app/build/outputs/apk/zh/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload English debug APK
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MagicNotice-en-debug
          path: app/build/outputs/apk/en/debug/*.apk
          if-no-files-found: error
          retention-days: 14
